<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="airpods">
    <allow own="net.mrcyjanek.sfos_airpods"/>
  </policy>
  <policy context="default">
    <allow send_destination="net.mrcyjanek.sfos_airpods"/>
    <allow receive_sender="net.mrcyjanek.sfos_airpods"/>
  </policy>
</busconfig>
